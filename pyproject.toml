[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

# ============================================================
# PROJECT METADATA
# ============================================================
[project]
name = "prismal-ai"
version = "3.12.0"
description = "Prism-inspired multi-agent orchestration framework built on LangGraph. Security-first, provider-agnostic, composable."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ernesto Crespo", email = "ecrespo@gmail.com" }]
maintainers = [{ name = "Ernesto Crespo", email = "ecrespo@gmail.com" }]
keywords = [
  "ai",
  "agent",
  "langgraph",
  "langchain",
  "mcp",
  "rag",
  "llm",
  "guardrails",
  "security",
  "multi-agent",
  "prismal",
  "supervisor-pattern",
  "agentic-ai",
  "agent-framework",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  # License classifier removed: incompatible with PEP 639 `License-Expression`
  # in Metadata 2.4. PyPI rejects uploads that mix both with HTTP 400.
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

# ============================================================
# CORE DEPENDENCIES (agent framework only — no API/UI/CLI)
# ============================================================
dependencies = [
  # ── LLM Orchestration ──────────────────────────────────────
  "langchain>=1.3.9",  # >=1.3.9 fixes GHSA-gr75-jv2w-4656 (pip-audit)
  "langgraph>=0.2.66",
  "langchain-community>=0.3.14",
  "langchain-core>=0.3.28",
  "litellm>=1.58.0",                # Provider-agnostic LLM proxy (Claude/OpenAI/Gemini/Ollama)
  "langchain-anthropic>=1.4.6",     # Anthropic Claude integration; >=1.4.6 fixes GHSA-gr75-jv2w-4656 (path traversal)
  "langchain-openai>=0.3.1",        # OpenAI integration
  "langchain-google-genai>=2.0.8",  # Google Gemini integration
  "langchain-litellm>=0.6.1",       # LiteLLM LangChain integration
  "langgraph-checkpoint-sqlite>=2.0.1", # LangGraph SQLite checkpointing
  # ── Data Layer ────────────────────────────────────────────
  "polars>=1.17.0",                 # High-performance DataFrame library
  "duckdb>=1.1.3",                  # In-process analytical SQL engine
  "pyarrow>=19.0.0",                # Required by DuckDB ↔ Polars interchange
  "sqlalchemy>=2.0.36",             # ORM + async support
  "alembic>=1.14.0",                # Database migrations
  "aiosqlite>=0.20.0",              # Async SQLite driver
  # ── Vector Database ───────────────────────────────────────
  "chromadb>=0.6.2",                # Embedding database for RAG
  # ── Document Processing ───────────────────────────────────
  "soupsieve>=2.8.4",               # bs4 CSS selector engine (transitive); >=2.8.4 fixes CVE-2026-49476 (memory exhaustion) + CVE-2026-49477 (ReDoS)
  "pypdf>=6.13.3",                  # PDF loader (>=6.13.3 fixes GHSA-jm82-fx9c-mx94; earlier >=6.12.0 fixed CVE-2026-48155/48156 DoS)
  "docx2txt>=0.8",                  # DOCX loader
  "unstructured>=0.21.5",           # Universal document parser (>=0.21.5: floor lifted so a fresh resolve on py3.13 can't drag ancient numba 0.53.1/llvmlite via the old dep tree — see CHANGELOG 3.10.1)
  "python-magic>=0.4.27",           # File type detection
  "icalendar>=6.0.0",               # iCalendar (.ics) parsing for calendar skill
  # ── Embeddings ────────────────────────────────────────────
  "sentence-transformers>=3.3.1",   # Local embeddings (HuggingFace)
  "tiktoken>=0.8.0",                # Token counting for OpenAI models
  # ── Lexical Retrieval ─────────────────────────────────────
  "rank-bm25>=0.2.2",               # BM25 ranking for hybrid search (SPEC-RAG-003)
  # ── Scheduler ─────────────────────────────────────────────
  "prefect>=3.6.28",                # Workflow orchestration (CVE-2026-7724 SSRF DNS-rebinding fix)
  "watchdog>=6.0.0",                # Filesystem event monitoring
  "apscheduler>=3.10",              # AsyncIOScheduler for cron execution
  "croniter>=2.0",                  # Cron expression parsing
  "tzlocal>=5.2",                   # OS timezone detection for DateTimeService
  # ── MCP (Model Context Protocol) ─────────────────────────
  "mcp>=1.2.0",                     # MCP client + protocol types
  # ── Security & Guardrails ─────────────────────────────────
  "nemoguardrails>=0.10.1",         # NVIDIA NeMo Guardrails for LLMs
  "bandit>=1.8.0",                  # Security linter (used in skill validation)
  # ── Configuration ─────────────────────────────────────────
  "pydantic>=2.10.3",               # Data validation
  "pydantic-settings>=2.14.2",      # Settings from env vars / .env files (>=2.14.2 fixes GHSA-4xgf-cpjx-pc3j)
  "python-dotenv>=1.0.1",           # .env file loading
  "pyyaml>=6.0.2",                  # YAML config files
  "toml>=0.10.2",                   # TOML config support
  "tomli_w>=1.0.0",                 # TOML serialisation for pyproject.toml writes
  # ── HTTP & Networking ─────────────────────────────────────
  "httpx>=0.28.1",                  # Async HTTP client
  "httpx-sse>=0.4.0",               # SSE support for httpx
  "aiohttp>=3.14.1",                # Async HTTP for MCP SSE transport (CVE-2026-5427x fixed in 3.14.1)
  # ── Observability ─────────────────────────────────────────
  "structlog>=24.4.0",              # Structured logging
  "loguru>=0.7.0",                  # Log sink: file rotation, retention, compression
  "langfuse>=2.0.0",                # LLM observability (traces, evals, costs)
  "opentelemetry-api>=1.29.0",      # OTEL API (tracing + metrics)
  "opentelemetry-exporter-otlp-proto-http>=1.29.0",  # OTLP HTTP exporter
  "opentelemetry-sdk>=1.29.0",      # Distributed tracing
  "psutil>=6.1.1",                  # System resource monitoring
  # ── Reliability ───────────────────────────────────────────
  "tenacity>=9.0.0",                # Retry logic with backoff
  "circuitbreaker>=2.0.0",          # Circuit breaker pattern
  # ── Security Primitives ───────────────────────────────────
  "pyjwt[crypto]>=2.10.0",          # JWT tokens for auth (migrated off python-jose → ecdsa CVE-2024-23342, 2026-07)
  "passlib[bcrypt]>=1.7.4",         # Password hashing
  "cryptography>=48.0.1",           # Crypto primitives (canary tokens; GHSA-537c-gmf6-5ccf fixed in 48.0.1)
  "xxhash>=3.5.0",                  # Fast hashing for audit log chain
]

# ============================================================
# OPTIONAL DEPENDENCIES
# ============================================================
[project.optional-dependencies]

# PostgreSQL support
postgres = [
  "psycopg2-binary>=2.9.10",
  "asyncpg>=0.30.0",
  "langgraph-checkpoint-postgres>=2.0.7",
]

# MongoDB support
mongodb = [
  "motor>=3.6.0",
  "beanie>=1.27.0",
]

# Full local embeddings (HuggingFace, no API required)
local-embeddings = [
  "torch>=2.6",            # >=2.6 neutralizes CVE-2026-1839 (transformers Trainer torch.load)
  "transformers>=5.3.0",   # >=5.3.0 fixes CVE-2026-4372 (RCE); earlier 4.x only on py>=3.14
  "accelerate>=1.2.1",
]

# Ollama local LLM support
ollama = [
  "ollama>=0.4.4",
  "langchain-ollama>=0.2.1",
]

# Analytics extras
analytics = [
  "matplotlib>=3.9.4",
  "plotly>=5.24.1",
  "pandas>=2.2.3",
]

# ML/AutoML pipeline (Phase 26)
ml = [
  "flaml>=2.3.0",
  "scikit-learn>=1.5.0",
  "xgboost>=2.1.0",
  "lightgbm>=4.5.0",
  "shap>=0.45.0",
  "imbalanced-learn>=0.12.0",
  "optuna>=3.6.0",
  "onnx>=1.22.0",                   # >=1.22.0 fixes GHSA-hwpq-hmq9-wj77 (null-pointer deref in Upsample version converter)
  "onnxruntime>=1.18.0",
]

# ML + Deep Learning (Phase 26)
ml-dl = [
  "prismal-ai[ml]",
  "torch>=2.6",  # >=2.6 neutralizes CVE-2026-1839 (transformers Trainer torch.load)
  "lightning>=2.4.0",
]

# Financial analysis (Phase 27)
finance = [
  "yfinance>=0.2.50",
  "pandas>=2.2.3",
  "pandas-ta>=0.3.14b",
]

# DateTime & timezone extras (Phase 28)
datetime = [
  "tzdata>=2024.1",
  "ntplib>=0.4.0",
]

# Package security & maintenance extras (Phase 30)
maintenance = [
  "pip-audit>=2.7.0",
]

# Vector store backends (Phase Z — interchangeable VectorStorePort)
# Chroma is a base dependency (default backend); these are opt-in alternatives.
lancedb = [
  "lancedb>=0.15.0",
]
sqlite-vec = [
  "sqlite-vec>=0.1.6",
]
qdrant = [
  "langchain-qdrant>=0.2.0",
  "qdrant-client>=1.12.0",
]
pgvector = [
  "langchain-postgres>=0.0.13",
  "psycopg[binary]>=3.2.0",
]

# A2A (Agent2Agent) interoperability (Phase I — opt-in)
# httpx / httpx-sse are already base dependencies; this extra documents the A2A
# client/server surface and pins the SSE transport for outbound streaming.
a2a = [
  "httpx>=0.28.1",
  "httpx-sse>=0.4.0",
]

# Multimodal layer — base media handling (Fase F)
multimodal = [
  "Pillow>=11.0.0",
  "ffmpeg-python>=0.2.0",
  "imagehash>=4.3.1",
]

# Multimodal — local STT (offline Whisper)
multimodal-local = [
  "faster-whisper>=1.1.0",
]

# Multimodal — premium TTS
multimodal-premium = [
  "elevenlabs>=1.13.0",
]

# Multimodal — cross-modal (CLIP) embeddings
multimodal-embed = [
  "open-clip-torch>=2.30.0",
  "torch>=2.6",  # >=2.6 neutralizes CVE-2026-1839 (transformers Trainer torch.load)
]

# Guardrails Modernization — structured-output validation via guardrails-ai (Phase GRD)
guardrails-ai = [
  "guardrails-ai>=0.10.2",
]

# All optional extras combined
all = [
  "prismal-ai[postgres,mongodb,local-embeddings,ollama,analytics,ml,finance,datetime,maintenance,lancedb,sqlite-vec,qdrant,pgvector,a2a,multimodal,multimodal-local,multimodal-premium,multimodal-embed,guardrails-ai]",
]

# Development tools
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "pytest-mock>=3.14.0",
  "pytest-xdist>=3.6.1",
  "httpx>=0.28.1",
  "faker>=33.1.0",
  "respx>=0.21.1",
  "ruff>=0.8.4",
  "mypy>=1.13.0",
  "ty>=0.0.1a5",
  "docformatter>=1.7.5",
  "pyupgrade>=3.19.0",
  "pre-commit>=4.0.1",
  "bandit[toml]>=1.8.0",
  "radon>=6.0.1",
  "lizard>=1.17.0",
  "mutmut>=3.2.0",
  "flake8>=7.2.0",
  "flake8-cognitive-complexity>=0.1.0",
  "pip-audit>=2.7.0",
  "types-pyyaml>=6.0.12.20240917",
  "types-toml>=0.10.8.20240310",
  "types-passlib>=1.7.7.20240819",
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.5.49",
  "mkdocstrings[python]>=0.27.0",
  "hatchling>=1.25.0",
  "build>=1.2.2",
  "twine>=6.0.1",
]

# ============================================================
# ENTRY POINTS
# ============================================================
[project.urls]
Homepage = "https://github.com/prismal-ai/prismal"
Documentation = "https://prismal.dev"
Repository = "https://github.com/prismal-ai/prismal"
"Bug Tracker" = "https://github.com/prismal-ai/prismal/issues"
Changelog = "https://github.com/prismal-ai/prismal/blob/main/CHANGELOG.md"

# ============================================================
# HATCH BUILD CONFIG — namespace package (PEP 420)
# prismal/ has NO __init__.py → implicit namespace package.
# Renamed from 'lightagent' in v3.0.0 (Estrategia B).
# ============================================================
[tool.hatch.build.targets.wheel]
packages = ["prismal"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.github",
  "/docs",
  "/tests",
  "/data/",
  "/compat",
  ".env",
  ".env.*",
]

# ============================================================
# RUFF — LINTER + FORMATTER
# ============================================================
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["prismal", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "ANN", "S", "B", "C4",
  "DTZ", "EM", "ISC", "ICN", "PIE", "PT", "RET", "SIM",
  "TCH", "ARG", "PTH", "ERA", "RUF", "C90",
]
ignore = [
  "S101", "S603", "S607", "EM101", "EM102",
  "RUF012", "ANN401", "ERA001",
]

[tool.ruff.lint.mccabe]
max-complexity = 40

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101", "S104", "S105", "S106", "S108", "S110", "S112",
  "S311", "ANN", "ARG", "DTZ", "N802", "N806", "N817",
  "E402", "E501", "SIM117", "F841", "TC", "PT", "PTH",
  "RUF", "RET504", "B017", "B904",
]
"examples/**/*.py" = [
  "S311", "ANN", "ARG", "N806", "E501", "E741",
  "RUF001", "RUF002", "RUF003", "SIM102", "F401",
]
"prismal/skills/available/**/*.py" = ["S603", "S607"]
"prismal/skills/custom/**/*.py" = ["S603", "S607"]
# Deprecated lightagent->prismal bridge: find_spec/exec_module signatures are
# mandated by importlib's MetaPathFinder/Loader ABCs, so unused args are unavoidable.
"compat/**/*.py" = ["ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["prismal"]
force-single-line = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ============================================================
# MYPY — TYPE CHECKING
# ============================================================
[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
show_error_codes = true
show_column_numbers = true
# Namespace packages support
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
# Módulos sin stubs o que son extras opcionales (protegidos con try/except
# o TYPE_CHECKING en el código). Mantener sincronizado con `ty.toml`.
module = [
  "litellm.*", "chromadb.*", "prefect.*", "watchdog.*",
  "nemoguardrails.*", "mcp.*", "structlog.*", "docx2txt.*",
  "unstructured.*", "alembic", "alembic.*",
  "apscheduler.*", "croniter.*", "rank_bm25.*",
  # Extras opcionales — resuelven import-not-found cuando el extra no está
  # instalado en el entorno de CI o del desarrollador.
  "yfinance", "ccxt", "pandas_ta", "pandas", "matplotlib", "matplotlib.*",
  "shap", "imblearn.*", "flaml", "skl2onnx", "skl2onnx.*",
  "motor", "motor.*", "aiosmtplib", "ntplib",
  "langgraph.checkpoint.postgres.*", "langgraph.store.postgres.*",
  "psutil", "joblib",
  # Multimodal extras (Fase F) — lazy-imported inside functions.
  "ffmpeg", "imagehash", "faster_whisper", "whisper",
  "open_clip", "pyttsx3", "elevenlabs", "elevenlabs.*", "cv2",
  # Vector store backends (Phase Z) — lazy-imported inside adapters.
  "lancedb", "lancedb.*", "sqlite_vec", "qdrant_client", "qdrant_client.*",
  "langchain_qdrant", "langchain_qdrant.*", "langchain_postgres", "langchain_postgres.*",
  # Optional notebook dependency for graph visualization.
  "IPython", "IPython.*",
  # Guardrails Modernization (Phase GRD) — lazy-imported inside structured_output_guard.py.
  "guardrails", "guardrails.*",
]
ignore_missing_imports = true

# ============================================================
# PYTEST
# ============================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "--tb=short",
  "-v",
  "-p", "no:freezegun",
]
markers = [
  "unit: Unit tests (no external services)",
  "integration: Integration tests (requires running services)",
  "security: Security-specific tests",
  "e2e: End-to-end tests through the compiled graph (deterministic, mocked LLM)",
  "slow: Tests that take > 5 seconds",
  "live_api: Tests that call real LLM APIs (require API keys)",
  "eval: Agent evaluation-harness suites (Phase V; deterministic with fakes)",
  "redteam: Adversarial / red-team containment suites (Phase V)",
]
filterwarnings = [
  "error",
  # Transitional 'LIGHTAGENT_' -> 'PRISMAL_' env-prefix fallback (env_compat).
  "ignore:The 'LIGHTAGENT_' environment-variable prefix is deprecated:DeprecationWarning",
  "ignore::DeprecationWarning:pydantic.*",
  "ignore::DeprecationWarning:chromadb.*",
  "ignore::DeprecationWarning:distutils.*",
  "ignore::DeprecationWarning:setuptools.*",
  "ignore::ResourceWarning:sqlite3",
  "ignore:.*unclosed.*:ResourceWarning",
  "ignore::ResourceWarning:aiosqlite",
  "ignore::pytest.PytestUnraisableExceptionWarning",
  # aiosqlite spawns a worker thread per connection. When an async test's
  # cleanup races the loop close, the worker raises after-the-fact and pytest
  # promotes it via filterwarnings=error. The connection itself is correctly
  # closed; it's a benign teardown artefact.
  "ignore::pytest.PytestUnhandledThreadExceptionWarning",
  "ignore:.*flow run id.*:UserWarning",
  "ignore:.*PREFECT_LOGGING.*:UserWarning",
]

# ============================================================
# COVERAGE
# ============================================================
[tool.coverage.run]
source = ["prismal"]
branch = true
omit = [
  "prismal/skills/custom/*",
  "*/__init__.py",
  "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@abstractmethod",
  "if __name__ == .__main__.:",
  "^\\s*\\.\\.\\.$",
  "@(typing\\.)?overload",
]
fail_under = 80
show_missing = true

# ============================================================
# BANDIT — SECURITY LINTING
# ============================================================
[tool.bandit]
exclude_dirs = ["tests", "prismal/skills/custom"]
skips = ["B101", "B104", "B608"]
severity_level = "medium"
confidence_level = "medium"

# ============================================================
# MUTMUT — MUTATION TESTING
# Scoped to the security layer (critical, well-tested, deterministic) so a
# full run completes in minutes rather than hours. Each surviving mutant is a
# gap in the security tests. Run on demand:
#   uv run mutmut run        # generate + test mutants
#   uv run mutmut results    # list survivors
#   uv run mutmut html       # browsable report
# ============================================================
[tool.mutmut]
paths_to_mutate = ["prismal/security/"]
tests_dir = ["tests/unit/security/", "tests/security/"]
# Only mutate lines exercised by the test suite (per coverage) — skips dead
# branches and speeds the run up considerably.
mutate_only_covered_lines = true

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]
