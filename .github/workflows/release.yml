# GitHub Actions Release — prismal-ai
# ============================================================
# Build + publish the prismal-ai distribution to PyPI. Replaces the build +
# publish stages of the former .gitlab-ci.yml.
#
# Triggered by pushing a release tag `prismal/vX.Y.Z`, or on every push to
# main (skip-existing makes it a no-op when the version is unchanged), or
# manually (workflow_dispatch) — the manual run can target TestPyPI for a dry
# run.
#
# Publishing uses an API token taken from a GitHub secret (NOT OIDC). Add the
# token in the repo settings, scoped to the relevant environment:
#   Settings → Environments → `pypi`     → Secrets → PYPI_API_TOKEN      = pypi-...
#   Settings → Environments → `testpypi` → Secrets → TEST_PYPI_API_TOKEN = pypi-...
# (A repo-level secret of the same name also works if you don't use
# per-environment protection.) The token's username is always `__token__`.
# ============================================================
name: Release

on:
  push:
    branches: [main] # build + publish on every push to main (skip-existing = no-op if version unchanged)
    tags: ["prismal/v*"] # and on release tags
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-python-env
      - name: Build + check
        run: |
          rm -rf dist/
          uv run python -m build
          uv run twine check dist/*
          ls -la dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          retention-days: 30

  # Publish to TestPyPI (manual dry runs only).
  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/prismal-ai/
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: true

  # Publish to PyPI on a release tag, on push to main, or a manual run targeting pypi.
  publish-pypi:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/prismal-ai/
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  # Create a GitHub Release with the built wheel/sdist as assets, only on a
  # release tag `prismal/vX.Y.Z`. Notes are extracted from CHANGELOG.md.
  github-release:
    if: startsWith(github.ref, 'refs/tags/prismal/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the release
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Extract changelog notes
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME##*/v}"           # prismal/v3.1.0 -> 3.1.0
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Pull the section between "## [VERSION]" and the next "## [" heading.
          awk -v v="## [$VERSION]" '
            index($0, v)==1 {f=1; next}
            /^## \[/ {f=0}
            f {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release $VERSION" > RELEASE_NOTES.md
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "prismal v$VERSION" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
