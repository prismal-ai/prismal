# GitHub Actions Release — prismal
# ============================================================
# Build + publish the prismal distribution to PyPI. Replaces the build +
# publish stages of the former .gitlab-ci.yml.
#
# Triggered by pushing a release tag `prismal/vX.Y.Z`, or manually
# (workflow_dispatch) — the manual run can target TestPyPI for a dry run.
#
# Publishing uses PyPI Trusted Publishing (OIDC) — no API token stored as a
# secret. Configure a Trusted Publisher for the `prismal` project at
# https://pypi.org/manage/account/publishing/ pointing at this repo, workflow
# `release.yml`, and environment `pypi` (and `testpypi` for the test target).
# To use an API token instead, replace the OIDC publish steps with
# `password: ${{ secrets.PYPI_API_TOKEN }}` and drop the `id-token` permission.
# ============================================================
name: Release

on:
  push:
    branches: [main] # build + publish on every push to main (skip-existing = no-op if version unchanged)
    tags: ["prismal/v*"] # and on release tags
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-python-env
      - name: Build + check
        run: |
          rm -rf dist/
          uv run python -m build
          uv run twine check dist/*
          ls -la dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          retention-days: 30

  # Publish to TestPyPI (manual dry runs only).
  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/prismal/
    permissions:
      id-token: write # OIDC for Trusted Publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # Publish to PyPI on a release tag (or manual run targeting pypi).
  publish-pypi:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/prismal/
    permissions:
      id-token: write # OIDC for Trusted Publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          skip-existing: true
