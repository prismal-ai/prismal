# OpenCode Zen / Go per-model wire protocols (Phase GW — SPEC-GW-OC-001, DD-GW-008).
#
# Sources (read 2026-10-05):
#   https://opencode.ai/docs/zen  — base https://opencode.ai/zen/v1
#   https://opencode.ai/docs/go   — base https://opencode.ai/zen/go/v1
#
# Illustrative; refresh_protocols() or edit to update.
#
# Protocols: openai_chat (/chat/completions), anthropic_messages (/messages),
# openai_responses (/responses). An id absent from this map raises
# GatewayConfigError("unknown_opencode_model") — protocols are never guessed.
# Deliberately omitted: Google-native Gemini models (/models/{id}, VERIFY.md
# GW0-05) and the Jev models served on /systemone — neither is a supported
# WireProtocol. Retention-denied ids (grok*, muse-spark*, deepseek-v4-flash*,
# VERIFY.md GW0-06) are listed for completeness; the deny-list refuses them
# before resolution.

