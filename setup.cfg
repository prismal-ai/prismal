# setup.cfg — LightAgent
# =====================================================================
# Configuracion de flake8 + plugin CCR001 (complejidad cognitiva).
# flake8 no lee pyproject.toml nativamente, por eso esta aqui.
# Solo se usa para: uv run flake8 lightagent/ --select=CCR001
# El resto del linting lo maneja Ruff (configurado en pyproject.toml).
# =====================================================================

[flake8]
# Solo activa la regla de complejidad cognitiva.
# Ruff cubre todo lo demas (E, W, F, I, B, S, C901).
extend-select = CCR001
# Baseline alineado con codebase actual (peor caso: _repl_async = 98).
# Meta a largo plazo: 12. Bajar progresivamente tras refactorizar.
max-cognitive-complexity = 100

# Excluye tests — la complejidad cognitiva en tests es aceptable
per-file-ignores =
    tests/*:CCR001
    test_*.py:CCR001

# Excluye directorios que no son codigo de la aplicacion
exclude =
    .venv,
    .git,
    __pycache__,
    build,
    dist,
    migrations
